# Publica uma versão nova sempre que o arquivo VERSAO muda no branch main:
# gera o pacote para Windows e cria uma "Release" no GitHub com os arquivos para baixar.
# As cópias já instaladas encontram essa Release e se atualizam ao abrir.
name: Publicar nova versão

on:
  push:
    branches: [main]
    paths: [VERSAO]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"  # igual à $VersaoPython do empacotar.ps1

      - name: Gerar pacote
        shell: pwsh
        run: ./empacotar.ps1

      - name: Publicar Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao=$(tr -d '[:space:]' < VERSAO)
          # Notas da versão: o trecho do NOVIDADES.md entre "## <versão>" e o próximo "## "
          awk -v v="## $versao" '{sub(/\r$/, "")} $0 == v {achou=1; next} /^## / {achou=0} achou' NOVIDADES.md > notas.md
          gh release create "v$versao" dist/OtimizadorDemanda.zip dist/atualizacao.zip \
            --title "Versão $versao" --notes-file notas.md
